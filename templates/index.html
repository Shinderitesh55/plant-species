<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Species Predictor</title>

    <link rel="stylesheet" href="static\style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Iris Species Predictor</h1>
            <p class="subtitle">
                Enter the flower measurements to predict its species.
            </p>

            <form id="predictionForm">

                <div class="form-group">
                    <label for="sepal_length">Sepal Length</label>
                    <input
                        type="number"
                        id="sepal_length"
                        step="0.1"
                        placeholder="Example: 5.1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="sepal_width">Sepal Width</label>
                    <input
                        type="number"
                        id="sepal_width"
                        step="0.1"
                        placeholder="Example: 3.5"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="petal_length">Petal Length</label>
                    <input
                        type="number"
                        id="petal_length"
                        step="0.1"
                        placeholder="Example: 1.4"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="petal_width">Petal Width</label>
                    <input
                        type="number"
                        id="petal_width"
                        step="0.1"
                        placeholder="Example: 0.2"
                        required
                    >
                </div>

                <button type="submit">
                    Predict Species
                </button>

            </form>

            <div id="result" class="result"></div>

        </div>

    </div>


    <script>
        document.getElementById("predictionForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                sepal_length: document.getElementById("sepal_length").value,
                sepal_width: document.getElementById("sepal_width").value,
                petal_length: document.getElementById("petal_length").value,
                petal_width: document.getElementById("petal_width").value
            };

            const resultDiv = document.getElementById("result");

            resultDiv.innerHTML = "Predicting...";

            try {

                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.innerHTML =
                        `<span>Predicted Species:</span> ${result.species}`;
                    resultDiv.className = "result success";
                } else {
                    resultDiv.innerHTML = `Error: ${result.error}`;
                    resultDiv.className = "result error";
                }

            } catch (error) {

                resultDiv.innerHTML =
                    "Unable to connect to the prediction server.";

                resultDiv.className = "result error";
            }

        });
    </script>

</body>
</html>
